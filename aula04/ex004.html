<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de strings</title>
</head>
<body>
    <script>
        var prog = "Javascript"
        document.write(`Estou aprendendo ${prog}<br>`)
        document.write(`Estou aprendendo ${prog.toUpperCase()}<br>`)
        document.write(`Estou aprendendo ${prog.toLowerCase()}<br>`)
        document.write(`A palavra ${prog} tem ${prog.length} letras`)
    </script>
</body>
</html>
