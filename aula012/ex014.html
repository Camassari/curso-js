<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            min-height: 100%;
            background-color: rgb(26, 129, 255);
        }

        header > h1 {
            color: white;
            text-align: center;
            margin-top: 10px;
        }
        main {
            width: 70%;
            background-color: white;
            margin: auto;
            height: 450px;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        footer {
            width: 100%;
        }

        footer > p {
            text-align: center;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Título</h1>
    </header>
    <main>
        <div>
            <p>Texto Exemplo 1</p>
        </div>
        <div>
            <p>Texto exemplo 2</p>
        </div>
    </main>
    <footer>
        <p>&copy; Enzo Camassari</p>
    </footer>
    <script>

    </script>
</body>
</html>
