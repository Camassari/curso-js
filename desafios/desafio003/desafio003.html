<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de idades</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            min-height: 100%;
            background-color: rgb(26, 129, 255);
        }

        header > h1 {
            color: white;
            text-align: center;
            margin-top: 10px;
        }
        main {
            width: 70%;
            background-color: white;
            margin: auto;
            height: 450px;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.397);
        }

        #campo > p {
            margin-bottom: 10px;
        } 

        footer {
            width: 100%;
        }

        footer > p {
            text-align: center;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Verificador de idade</h1>
    </header>
    <main>
        <div id="campo">
            <p>
                Ano de nascimento: <input type="number" name="ano" id="iano" placeholder="Ano">
            </p>
            <p>
                Sexo: 
                <input type="radio" name="sexrad" id="mas" checked>
                <label for="mas">Masculino</label>
                <input type="radio" name="sexrad" id="fem">
                <label for="fem">Feminino</label>
            </p>
            <p><input type="submit" value="Confirmar" onclick="calcular()"></p>
        </div>
        <div id="resultado">
            <p id="resultado">Preencha os campos acima e veja o resultado</p>
        </div>
    </main>
    <footer>
        <p>&copy; Enzo Camassari</p>
    </footer>
    <script src="scripts/script.js"></script>
</body>
</html>
