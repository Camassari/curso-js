<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            min-height: 100%;
            background-color: rgb(26, 129, 255);
        }

        header > h1 {
            color: white;
            text-align: center;
            margin-top: 10px;
        }
        main {
            width: 70%;
            background-color: white;
            margin: auto;
            height: 450px;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.397);
        }

        footer {
            width: 100%;
        }

        footer > p {
            text-align: center;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Analisador de números</h1>
    </header>
    <main>
        <div>
            <p>Número entre 1 e 100: <input type="number" name="num" id="num"><input type="submit" value="Enviar" onclick="adicionar()"></p>

            <select name="select" id="select" size="10"></select>
            <p><input type="submit" value="Finalizar" onclick="finalizar()"></p>
        </div>
        <div>
            <p id="resultado"></p>
        </div>
    </main>
    <footer>
        <p>&copy; <em>Enzo Camassari</em></p>
    </footer>
    <script src="scripts/script.js"></script>
</body>
</html>
